name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: 0. Install Chinese Language Pack (zh-CN)
        # Windows PowerShell 5.1 is required: New-WinUserLanguageList returns a WinRT object
        # that pwsh 7 (.NET Core) cannot marshal ("Cannot marshal 'parameter #1'").
        # Keep this script ASCII-only: GitHub writes run blocks as UTF-8 without BOM and
        # 5.1 parses .ps1 as ANSI, which corrupts non-ASCII and breaks the parser.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Try LanguagePackManagement first (Windows 11 / Server 2022)
          $installed = $false
          if (Get-Command Install-Language -ErrorAction SilentlyContinue) {
              try {
                  Install-Language -Language zh-CN -CopyToSettings
                  $installed = $true
                  Write-Host "Install-Language zh-CN finished."
              } catch {
                  Write-Host "Install-Language failed, falling back to Features on Demand: $($_.Exception.Message)"
              }
          }

          # Fallback: install basic language pack and Hans fonts as Features on Demand
          if (-not $installed) {
              foreach ($cap in @("Language.Basic~~~zh-CN~0.0.1.0", "Language.Fonts.Hans~~~und-HANS~0.0.1.0")) {
                  try {
                      Write-Host "Installing $cap ..."
                      Add-WindowsCapability -Online -Name $cap | Out-Null
                      $installed = $true
                  } catch {
                      Write-Host "Installing $cap failed: $($_.Exception.Message)"
                  }
              }
          }

          # Apply UI language and culture to current user, welcome screen and new users
          # (NvdAdmin is created later and inherits the default profile settings)
          try { Set-WinUserLanguageList -LanguageList (New-WinUserLanguageList -Language zh-CN) -Force } catch { Write-Warning "Set-WinUserLanguageList failed: $($_.Exception.Message)" }
          try { Set-WinUILanguageOverride -Language zh-CN } catch { Write-Warning "Set-WinUILanguageOverride failed: $($_.Exception.Message)" }
          try { Set-Culture -CultureInfo zh-CN } catch { Write-Warning "Set-Culture failed: $($_.Exception.Message)" }
          try { Copy-UserInternationalSettingsToSystem -WelcomeScreen $true -NewUser $true } catch { Write-Warning "Copy-UserInternationalSettingsToSystem failed: $($_.Exception.Message)" }

          # Verify: fail loudly instead of reporting READY on an English desktop
          if (Get-Command Get-InstalledLanguage -ErrorAction SilentlyContinue) {
              Write-Host "Installed languages: $(((Get-InstalledLanguage).LanguageId) -join ', ')"
          }
          $ui = Get-WinUILanguageOverride
          Write-Host "UI language override: $($ui.Name)"
          if (-not $ui -or $ui.Name -ne "zh-CN") {
              throw "UI language override is not zh-CN. Verify the zh-CN language pack is available on this image."
          }

      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvdAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvdAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # Download and install Tailscale silently
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          $msi = Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait -PassThru
          if ($msi.ExitCode -ne 0) { throw "Tailscale MSI install failed, msiexec exit code $($msi.ExitCode)" }

          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          for ($i = 1; $i -le 30 -and -not (Test-Path $ts); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $ts)) { throw "tailscale.exe not found at $ts after install" }

          # Connect to Tailscale network
          & $ts up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" --timeout=120s
          $upExit = $LASTEXITCODE
          if ($upExit -ne 0) {
              Write-Host "----- tailscale status -----"
              & $ts status
              Write-Host "----------------------------"
              throw "tailscale up failed, exit code $upExit (see status above: bad/expired key, or node awaiting approval)"
          }

          # Wait until a Tailscale IPv4 address is actually assigned
          # (the old fixed 8s sleep was the reason the banner could show an empty IP)
          $ts_ip = $null
          for ($i = 1; $i -le 90; $i++) {
              $ts_ip = & $ts ip -4 2>$null | Select-Object -First 1
              if ($ts_ip) { break }
              Start-Sleep -Seconds 2
          }
          if (-not $ts_ip) {
              Write-Host "----- tailscale status -----"
              & $ts status
              Write-Host "----------------------------"
              throw "No Tailscale IPv4 address was assigned within 180s; status printed above."
          }

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      - name: 4. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/2880] Server running..."
          }
